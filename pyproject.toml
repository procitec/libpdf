[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "libpdf"
version = "0.1.0-post2"
description = "Extract structured data from PDFs."
readme = "README.rst"
requires-python = ">=3.8"
license = "MIT"
authors = [
    { name = "Marco Heinemann", email = "marco.heinemann@useblocks.com" },
]
maintainers = [
    { name = "Jui-Wen Chen", email = "jui-wen.chen@useblocks.com" },
    { name = "Haiyang Zhang", email = "haiyang.zhang@useblocks.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing",
    "Topic :: Utilities",
]
dependencies = [
    "chardet",
    "click",
    "PyYAML",
    "ruamel.yaml",

    # dependencies needed by pdfminer.six and pdfplumber which are delivered as wheels in the deps folder
    # the libs were patched and no upstream PR has been raised yet
    "pycryptodome",
    "sortedcontainers",
    "pillow; python_version < '3.13'",
    "pillow>=11; python_version >= '3.13'",
    "unicodecsv",
    "wand",
    "pdfplumber",
    "pdfminer-six",
]

[project.optional-dependencies]
tqdm = ["tqdm"]
colorama = ["colorama"]
docs = [
    "sphinx",
    "sphinx-rtd-theme",
    "sphinxcontrib-plantuml",
]

[project.urls]
Homepage = "http://pypi.python.org/pypi/libpdf"
Repository = "http://github.com/useblocks/libpdf"
Documentation = "http://libpdf.readthedocs.io/en/latest"

[project.scripts]
libpdf = "libpdf.core:main_cli"

[dependency-groups]
test = [
    "pytest",
    "pytest-cov",
    "pytest-xdist",
]
lint = [
    "ruff",
]
docs = [
    "sphinx",
    "sphinx-rtd-theme",
    "sphinxcontrib-plantuml",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "docs" },
    "tox",
]

[tool.uv]
package = true
default-groups = ["dev"]

[tool.hatch.build.targets.sdist]
include = [
    "/deps",
    "/docs",
    "/libpdf",
    "/tests",
    "/README.rst",
]

[tool.hatch.build.targets.wheel]
packages = ["libpdf"]
artifacts = [
    "deps/*",
]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

# use Black's default
line-length = 88

# lint according to oldest supported version
target-version = "py310"

# try out unstable rules, fixes, and formatting
# changes are reviewed anyway
preview = true

[tool.ruff.lint]
# concept: select all rules by default and ignore unwanted (maybe just per file)
# this comes at a cost: new added rules are applied automatically, so a CI that
# runs green today might fail tomorrow in case ruff gets updated
select = ["ALL"]
ignore = [
    "ANN101", # missing-type-self - infer typing is simple for this library
    "COM812", # missing-trailing-comma - may conflict with Ruff formatter
    "CPY001", # missing-copyright-notice - specified on project level
    "D107",   # undocumented-public-init - commonly the docstring provides no helpful information
    "D203",   # D203 and D211 are mutually exclusive: https://github.com/PyCQA/pydocstyle/issues/141
    "D212",   # D212 and D213 are mutually exclusive: https://stackoverflow.com/a/45990465
    "FBT001", # boolean-type-hint-positional-argument - good message, but need a concept how to deal with this
    "FIX002", # line-contains-todo - TODOs are considered helpful
    "ISC001", # may conflict with Ruff formatter
    "TD003",  # missing-todo-link - no big processes for us
]

# Allow autofix for all enabled rules when `--fix` is provided.
fixable = ["ALL"]
unfixable = [
    "D400",   # ends-in-period - dangerous to use (ruff may confuse summary line and content)
    "ERA001", # commented-out-code - commented code is commonly there for a reason
]

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true  # no init return type needed if at least one arg is annotated

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = [
    "D104",
] # Missing docstring in public package - not needed for inits
"tests/**/*.py" = [
    "S101", # Use of `assert` detected
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.tox]
legacy_tox_ini = """
[tox]
min_version = 4.0
envlist = py{38,39,310,311,312,313}, docs, lint, format-check

[testenv]
deps = uv
skip_install = true
passenv = *
py_folders = examples libpdf tests
commands_pre =
    uv pip install -e .[tqdm,colorama] --group test
commands =
    python -m pytest -n auto --tb=long {posargs}

[testenv:py313]
# Generate coverage report only for latest Python
commands =
    python -m pytest -n auto --tb=long --cov=libpdf --cov-fail-under=80 {posargs}

[testenv:docs]
basepython = python3.13
commands_pre =
    uv pip install -e .[docs] --group docs
commands =
    sphinx-build -W -b html docs docs/_build/html

[testenv:lint]
basepython = python3.13
commands_pre =
    uv pip install --group lint
commands =
    ruff format --check {[testenv]py_folders}
    # The former ruff-lint.toml limited linting to the files below.
    # Keep this list here so formatting and linting can still cover different scopes.
    ruff check --output-format=concise libpdf/models/horizontal_box.py libpdf/utils.py tests/conftest.py

[testenv:format-check]
basepython = python3.13
commands_pre =
    uv pip install --group lint
commands =
    ruff format --check {[testenv]py_folders}

[testenv:format]
basepython = python3.13
commands_pre =
    uv pip install --group lint
commands =
    ruff format {[testenv]py_folders}
    ruff check --fix --exit-zero --silent {[testenv]py_folders}
"""
